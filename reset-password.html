
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reset Password | KMT Staff Portal</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #f2f4f8;
      font-family: Arial, sans-serif;
      padding: 20px;
    }

    .container {
      background: white;
      width: 100%;
      max-width: 420px;
      padding: 30px;
      border-radius: 12px;
      box-shadow: 0 4px 18px rgba(0,0,0,0.10);
    }

    h2 {
      color: #071b3a;
      text-align: center;
      margin-bottom: 8px;
    }

    .subtitle {
      text-align: center;
      color: #666;
      font-size: 14px;
      margin-bottom: 25px;
    }

    label {
      display: block;
      margin: 15px 0 7px;
      font-weight: bold;
      color: #333;
    }

    input {
      width: 100%;
      padding: 13px;
      border: 1px solid #ccc;
      border-radius: 6px;
      font-size: 15px;
    }

    button {
      width: 100%;
      padding: 13px;
      margin-top: 22px;
      background: #071b3a;
      color: white;
      border: none;
      border-radius: 6px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    button:hover {
      background: #d66a00;
    }

    #message {
      margin-top: 18px;
      text-align: center;
      font-size: 14px;
      line-height: 1.5;
    }

    .back {
      display: block;
      text-align: center;
      margin-top: 20px;
      color: #071b3a;
      text-decoration: none;
      font-size: 14px;
    }

    .footer {
      text-align: center;
      color: #888;
      font-size: 12px;
      margin-top: 25px;
    }
  </style>
</head>

<body>

  <div class="container">

    <h2>KMT Staff Portal</h2>

    <p class="subtitle">Create a new password for your account.</p>

    <div id="resetSection" style="display:none;">

      <form id="resetForm">

        <label for="newPassword">New Password</label>
        <input
          type="password"
          id="newPassword"
          placeholder="Enter new password"
          minlength="8"
          required
        >

        <label for="confirmPassword">Confirm New Password</label>
        <input
          type="password"
          id="confirmPassword"
          placeholder="Confirm new password"
          minlength="8"
          required
        >

        <button type="submit" id="resetButton">
          Update Password
        </button>

      </form>

    </div>

    <p id="message">Verifying your recovery link...</p>

    <a href="staff-login.html" class="back">
      Back to Staff Login
    </a>

    <div class="footer">
      KING'S MEDIA & TECH LTD.<br>
      Bridging the Tech Divide
    </div>

  </div>

  <script>
    const SUPABASE_URL =
      'https://pcvjtkctxfgsynportqr.supabase.co';

    const SUPABASE_KEY =
      'sb_publishable_noW8Cu33b3m48nbWeNKTxw_u037wFxQ';

    const supabaseClient = window.supabase.createClient(
      SUPABASE_URL,
      SUPABASE_KEY
    );

    const message = document.getElementById('message');
    const resetSection = document.getElementById('resetSection');

    async function verifyRecoverySession() {

      const { data, error } =
        await supabaseClient.auth.getSession();

      if (error || !data.session) {
        message.style.color = '#b00020';
        message.textContent =
          'This password recovery link is invalid or has expired. Please request another recovery email.';
        return;
      }

      resetSection.style.display = 'block';
      message.textContent = '';
    }

    document.getElementById('resetForm').addEventListener(
      'submit',
      async function(event) {

        event.preventDefault();

        const newPassword =
          document.getElementById('newPassword').value;

        const confirmPassword =
          document.getElementById('confirmPassword').value;

        const button =
          document.getElementById('resetButton');

        if (newPassword.length < 8) {
          message.style.color = '#b00020';
          message.textContent =
            'Password must contain at least 8 characters.';
          return;
        }

        if (newPassword !== confirmPassword) {
          message.style.color = '#b00020';
          message.textContent =
            'The passwords do not match.';
          return;
        }

        button.disabled = true;
        button.textContent = 'Updating...';

        const { error } =
          await supabaseClient.auth.updateUser({
            password: newPassword
          });

        if (error) {
          message.style.color = '#b00020';
          message.textContent = error.message;

          button.disabled = false;
          button.textContent = 'Update Password';
          return;
        }

        await supabaseClient.auth.signOut();

        resetSection.style.display = 'none';
        message.style.color = '#187a35';
        message.textContent =
          'Your password has been updated successfully. You can now return to the login page and sign in with your new password.';
      }
    );

    verifyRecoverySession();
  </script>

</body>
</html>
