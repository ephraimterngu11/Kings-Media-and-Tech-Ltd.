<!DOCTYPE html>

<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>KMT Staff Login</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f4f6f9;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .login-container {
      width: 100%;
      max-width: 420px;
      background: white;
      padding: 35px;
      border-radius: 12px;
      box-shadow: 0 5px 25px rgba(0,0,0,0.12);
    }

    .header {
      text-align: center;
      margin-bottom: 25px;
    }

    .header h1 {
      margin: 0;
      color: #071b3a;
      font-size: 24px;
    }

    .header p {
      margin-top: 8px;
      color: #d66a00;
      font-weight: bold;
    }

    .header small {
      color: #666;
    }

    label {
      display: block;
      margin-bottom: 7px;
      color: #071b3a;
      font-weight: bold;
    }

    input {
      width: 100%;
      padding: 12px;
      margin-bottom: 18px;
      border: 1px solid #ccc;
      border-radius: 6px;
      font-size: 15px;
    }

    input:focus {
      outline: none;
      border-color: #d66a00;
    }

    button {
      width: 100%;
      padding: 13px;
      border: none;
      border-radius: 6px;
      background: #071b3a;
      color: white;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    button:hover {
      background: #d66a00;
    }

    button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    #message {
      margin-top: 18px;
      text-align: center;
      font-weight: bold;
      line-height: 1.5;
    }

    .back-link {
      display: block;
      text-align: center;
      margin-top: 20px;
      color: #071b3a;
      text-decoration: none;
    }

    .back-link:hover {
      color: #d66a00;
    }
  </style>

</head>

<body>

  <div class="login-container">

```
<div class="header">
  <h1>KING'S MEDIA & TECH LTD.</h1>
  <p>Bridging the Tech Divide</p>
  <small>Staff Portal</small>
</div>


<form id="loginForm">

  <label for="email">Email Address</label>

  <input
    type="email"
    id="email"
    placeholder="Enter your email address"
    required
  >


  <label for="password">Password</label>

  <input
    type="password"
    id="password"
    placeholder="Enter your password"
    required
  >


  <button type="submit" id="loginButton">
    Login
  </button>

</form>


<div id="message"></div>


<a href="index.html" class="back-link">
  ← Back to Homepage
</a>
```

  </div>

  <script>

    /*
      SUPABASE CONNECTION
    */

    const SUPABASE_URL =
      'https://pcvjtkctxfgsynportqr.supabase.co';

    const SUPABASE_KEY =
      'sb_publishable_noW8Cu33b3m48nbWeNKTxw_u037wFxQ';


    const supabaseClient =
      window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
      );


    /*
      LOGIN
    */

    document
      .getElementById('loginForm')
      .addEventListener('submit', async function(event) {

        event.preventDefault();


        const email =
          document
            .getElementById('email')
            .value
            .trim();

        const password =
          document
            .getElementById('password')
            .value;


        const message =
          document.getElementById('message');

        const loginButton =
          document.getElementById('loginButton');


        message.textContent =
          'Checking login...';

        message.style.color =
          '#071b3a';

        loginButton.disabled = true;


        /*
          STEP 1:
          Authenticate with Supabase
        */

        const {
          data,
          error
        } =
          await supabaseClient.auth.signInWithPassword({

            email: email,
            password: password

          });


        if (error) {

          message.textContent =
            'Login failed: ' +
            error.message;

          message.style.color =
            '#b00020';

          loginButton.disabled = false;

          return;
        }


        /*
          STEP 2:
          Confirm that a user was returned
        */

        if (!data.user) {

          message.textContent =
            'Unable to identify your staff account.';

          message.style.color =
            '#b00020';

          loginButton.disabled = false;

          return;
        }


        /*
          STEP 3:
          Check the staff profile
          and account status.
        */

        const {
          data: profile,
          error: profileError
        } =
          await supabaseClient
            .from('staff_profiles')
            .select('name, role, post, is_active')
            .eq('id', data.user.id)
            .single();


        /*
          STEP 4:
          Handle missing profile
        */

        if (profileError || !profile) {

          await supabaseClient.auth.signOut();

          message.textContent =
            'Staff profile not found. Please contact the Chief Admin.';

          message.style.color =
            '#b00020';

          loginButton.disabled = false;

          console.error(profileError);

          return;
        }


        /*
          STEP 5:
          Check whether the account is active.
        */

        if (profile.is_active !== true) {

          /*
            Immediately sign the user out.
          */

          await supabaseClient.auth.signOut();


          message.textContent =
            'Access denied. Your staff account is currently inactive. Please contact the Chief Admin.';

          message.style.color =
            '#b00020';

          loginButton.disabled = false;

          return;
        }


        /*
          STEP 6:
          Staff is active.
          Allow access to dashboard.
        */

        message.textContent =
          'Login successful! Redirecting...';

        message.style.color =
          'green';


        setTimeout(function() {

          window.location.href =
            'staff-dashboard.html';

        }, 700);

      });

  </script>

</body>
</html>
