<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Staff Portal | King's Media & Tech Ltd.</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #000080, #172554);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .login-container {
      width: 100%;
      max-width: 420px;
      background: white;
      border-radius: 15px;
      padding: 35px 25px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.25);
    }

    .logo-area {
      text-align: center;
      margin-bottom: 25px;
    }

    .logo-area h1 {
      margin: 0;
      color: #000080;
      font-size: 25px;
    }

    .tagline {
      color: #f5a623;
      font-weight: bold;
      margin-top: 8px;
    }

    .portal-title {
      text-align: center;
      color: #333;
      margin-bottom: 25px;
    }

    .portal-title h2 {
      margin-bottom: 5px;
    }

    .portal-title p {
      margin-top: 5px;
      color: #666;
      font-size: 14px;
    }

    label {
      display: block;
      margin-bottom: 7px;
      font-weight: bold;
      color: #333;
    }

    input {
      width: 100%;
      padding: 13px;
      margin-bottom: 18px;
      border: 1px solid #ccc;
      border-radius: 7px;
      font-size: 16px;
    }

    input:focus {
      outline: none;
      border-color: #000080;
    }

    button {
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 7px;
      background: #f5a623;
      color: #000080;
      font-size: 17px;
      font-weight: bold;
      cursor: pointer;
    }

    button:hover {
      opacity: 0.9;
    }

    #message {
      margin-top: 18px;
      text-align: center;
      font-weight: bold;
      font-size: 14px;
    }

    .back-home {
      display: block;
      text-align: center;
      margin-top: 20px;
      color: #000080;
      text-decoration: none;
      font-size: 14px;
    }
  </style>
</head>

<body>

  <div class="login-container">

    <div class="logo-area">
      <h1>KING'S MEDIA & TECH LTD.</h1>
      <div class="tagline">Bridging the Tech Divide</div>
    </div>

    <div class="portal-title">
      <h2>Staff Portal</h2>
      <p>Authorized staff members only</p>
    </div>

    <form id="loginForm">

      <label for="email">Email Address</label>
      <input
        type="email"
        id="email"
        placeholder="Enter your staff email"
        required
      >

      <label for="password">Password</label>
      <input
        type="password"
        id="password"
        placeholder="Enter your password"
        required
      >

      <button type="submit" id="loginButton">
        Login
      </button>

    </form>

    <div id="message"></div>

    <a href="index.html" class="back-home">
      ← Back to KMT Website
    </a>

  </div>

</body>
</html>
